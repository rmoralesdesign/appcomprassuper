<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f5c518">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Compras">
<title>Compras del Súper</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de una pantalla; cabecera fija con la etiqueta de precio (totales), lista que se desliza, barra de pestañas abajo. */
:root{
  --bg:#f1f5f2; --surface:#ffffff; --ink:#14231d; --muted:#5b6d65; --line:#d6dfda;
  --accent:#f5c518; --on-accent:#1c1a05; --ok-bg:#c9efd6; --ok-ink:#0e5a2d; --ok:#1f9d55;
  --danger:#c7372f; --field:#f6f9f7;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif; --body:"Figtree",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#19211e; --ink:#e8efeb; --muted:#94a69d; --line:#2b3732;
  --accent:#f5c518; --on-accent:#1c1a05; --ok-bg:#173f29; --ok-ink:#93e2b0; --ok:#36c275;
  --danger:#ff7b72; --field:#121917; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#19211e; --ink:#e8efeb; --muted:#94a69d; --line:#2b3732;
  --accent:#f5c518; --on-accent:#1c1a05; --ok-bg:#173f29; --ok-ink:#93e2b0; --ok:#36c275;
  --danger:#ff7b72; --field:#121917; color-scheme:dark }
*{box-sizing:border-box}
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.35}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#app{height:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column}
header{padding:8px 16px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1{font-family:var(--display);font-weight:800;font-size:19px;margin:0;letter-spacing:-.02em}
#sync{font-size:12px;color:var(--muted)}
.tag{background:var(--accent);color:var(--on-accent);border-radius:12px 12px 12px 4px;padding:7px 8px 7px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag .tg{min-width:0;display:flex;flex-direction:column;gap:1px}
.tag .l1{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.tag .l2{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.tag small{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.tag b{font-family:var(--display);font-weight:800;font-size:23px;line-height:1;font-variant-numeric:tabular-nums}
.tag .cart{text-align:right;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.supers{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.sup{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:120px}
.sup span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.sup strong{display:block;font-variant-numeric:tabular-nums;font-size:15px}
.sup em{font-style:normal;font-size:12px;color:var(--muted)}
.acts{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-weight:600;min-height:40px}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.warn{color:var(--danger)}
.acts .btn{flex:1}
.stage{position:relative;flex:1;min-height:0}
main{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 16px 96px}
#fab{position:absolute;right:16px;bottom:16px;width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font-size:34px;font-weight:700;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.28)}
nav{display:flex;border-top:1px solid var(--line);background:var(--surface)}
nav button{flex:1;min-width:0;border:0;background:none;padding:12px 2px;font-size:12px;font-weight:600;color:var(--muted);border-top:3px solid transparent}
nav button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.grp{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:10px 0 2px}
.line{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:flex-start}
.line.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok-ink)}
.line input[type=checkbox]{width:28px;height:28px;accent-color:var(--ok);margin:2px 0 0;flex:0 0 auto}
.lb{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.lt{display:flex;gap:8px;align-items:flex-start}
.desc{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.desc small{display:block;font-weight:500;font-size:12px;opacity:.75}
.tot{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.minus{flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:1px solid var(--danger);background:transparent;color:var(--danger);font-size:22px;font-weight:700;line-height:1;padding:0}
.flds{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.7fr) minmax(0,1fr);gap:6px}
.flds label,.form label{font-size:11px;font-weight:600;display:flex;flex-direction:column;gap:2px;min-width:0}
input[type=text],input[type=search],select{width:100%;min-width:0;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:38px;color:var(--ink)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.form{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.form .row{display:flex;gap:8px;flex-wrap:wrap}
.form .row>*{flex:1 1 140px;min-width:0}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:center}
.item .desc{font-weight:600}
.item .btn{padding:6px 10px;min-height:34px;font-size:13px}
button.item{width:100%;text-align:left}
.empty{color:var(--muted);text-align:center;padding:32px 12px}
h2{font-family:var(--display);font-size:19px;margin:0 0 10px}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px}
summary{padding:12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700;font-variant-numeric:tabular-nums}
summary small{font-weight:500;color:var(--muted)}
.tw{overflow-x:auto;padding:0 12px 12px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left;white-space:normal}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:10}
.sheet{background:var(--surface);color:var(--ink);border-radius:16px;padding:16px;width:100%;max-width:520px;max-height:86%;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.sheet ul{overflow-y:auto;flex:1;min-height:0}
.sheet h2{margin:0}
.sheet p{margin:0}
.yn{display:flex;gap:10px}
.yn .btn{flex:1;font-size:17px;min-height:48px}
main .tools{position:sticky;top:-12px;z-index:2;background:var(--bg);margin:-12px 0 4px;padding-block:12px 8px;display:flex;flex-direction:column;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips small{font-size:12px;font-weight:600;color:var(--muted);margin-right:2px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;min-height:34px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#lf-msg{font-size:13px;color:var(--muted);margin:0}
.sup em b{font-weight:700;color:var(--ink)}
.mbtn{flex:0 0 auto;position:relative;display:flex;align-items:center;gap:6px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:700;min-height:42px;padding:0 12px}
.mbtn i{font-style:normal;font-size:18px;line-height:1}
.mbtn em{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--danger);color:#fff;font-style:normal;font-size:12px;display:grid;place-items:center;padding:0 5px}
.mlab{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.mopt{width:100%;display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 12px;min-height:52px}
.mopt[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-bg);color:var(--ok-ink)}
.mopt .bx{width:22px;height:22px;border-radius:6px;border:2px solid currentColor;flex:0 0 auto;display:grid;place-items:center;font-weight:800;font-size:14px}
.mopt .nm{flex:1;min-width:0;font-weight:700}
.mopt .nm small{display:block;font-weight:500;font-size:12px;opacity:.8}
.mopt .am{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.yn.mact .btn{font-size:15px}
.fbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;font-weight:600}
#m-form{display:flex;flex-direction:column;gap:12px;min-height:0;flex:1;margin:0}
.pk{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.pk.on{border-color:var(--ok);background:var(--ok-bg);color:var(--ok-ink)}
.ph{display:flex;gap:10px;align-items:center;cursor:pointer}
.ph input[type=checkbox]{width:26px;height:26px;accent-color:var(--ok);flex:0 0 auto;margin:0}
#m-sum{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.btn:disabled{opacity:.5;cursor:default}
#toast{position:fixed;left:16px;right:16px;bottom:84px;margin:auto;max-width:420px;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:10px;text-align:center;font-weight:600;z-index:20}
@media (min-width:600px){#modal{align-items:center}}
</style>
</head>
<body>
<script>
/* ===== CONFIGURACION DE FIREBASE: INICIO (reemplace desde aqui) ===== */
const firebaseConfig = {
  apiKey: "PEGUE_AQUI",
  authDomain: "PEGUE_AQUI",
  projectId: "PEGUE_AQUI",
  storageBucket: "PEGUE_AQUI",
  messagingSenderId: "PEGUE_AQUI",
  appId: "PEGUE_AQUI"
};
/* ===== CONFIGURACION DE FIREBASE: FIN (reemplace hasta aqui) ===== */
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<div id="app">
  <header>
    <div class="brand"><h1>Compras del Súper</h1><span style="display:flex;gap:8px;align-items:center"><span id="sync">Conectando…</span><button id="out" class="btn" style="min-height:32px;padding:4px 10px;font-size:13px" hidden>Salir</button></span></div>
    <div id="stats"></div>
  </header>
  <div class="stage">
    <main id="view"><p class="empty">Cargando la lista compartida…</p></main>
    <button id="fab" data-act="add" aria-label="Agregar producto a la lista" hidden>+</button>
  </div>
  <nav id="nav">
    <button data-go="lista">Lista</button>
    <button data-go="prod">Productos</button>
    <button data-go="sup">Súpers</button>
    <button data-go="cat">Categorías</button>
    <button data-go="hist">Histórico</button>
  </nav>
</div>
<div id="modal" hidden></div>
<div id="toast" role="status" hidden></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLS={cat:'categorias',sup:'supermercados',prod:'productos',lista:'lista',hist:'compras'};
const K={cat:{uno:'categoría',f:'nombre',titulo:'Categorías'},sup:{uno:'supermercado',f:'nombre',titulo:'Supermercados'},prod:{uno:'producto',f:'descripcion',titulo:'Productos'}};
const S={cat:{},sup:{},prod:{},lista:{},hist:{}};
const loaded={};
const fSup=new Set();let lq='';
let db=null,view='lista',dirty=false,onYes=null,toastT=0,authed=false,denied=false,aviso='',unsubs=[];

const money=n=>{const [i,d]=(Math.round((+n||0)*100)/100).toFixed(2).split('.');return '₡'+i.replace(/\B(?=(\d{3})+(?!\d))/g,' ')+','+d};
const parseNum=v=>{let s=String(v).replace(/[\s ₡]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isFinite(n)&&n>=0?n:0};
const numIn=(n,dec)=>dec?(+n||0).toFixed(2).replace('.',','):String(+n||0).replace('.',',');
const norm=s=>String(s||'').trim().toLowerCase();
const byName=(o,f)=>Object.entries(o).sort((a,b)=>String(a[1][f]||'').localeCompare(String(b[1][f]||''),'es'));
const nSup=id=>S.sup[id]?.nombre||'Sin supermercado';
const nCat=id=>S.cat[id]?.nombre||'Sin categoría';
const nProd=id=>S.prod[id]?.descripcion||'Producto eliminado';
const lineTot=l=>(+l.cantidad||0)*(+l.costo||0);

function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}
async function save(p){try{await p;return true}catch(e){toast(e&&e.code==='quota_exceeded'?'El almacenamiento está lleno. Elimine compras antiguas.':'No se pudo guardar. Es posible que solo tenga permiso de lectura.');render();return false}}
function modal(html){menuOpen=false;$('#modal').innerHTML='<div class="sheet" role="dialog" aria-modal="true">'+html+'</div>';$('#modal').hidden=false}
function closeModal(){menuOpen=false;$('#modal').hidden=true;$('#modal').innerHTML='';onYes=null}
function confirmar(msg,fn){onYes=fn;modal('<p>'+esc(msg)+'</p><div class="yn"><button class="btn pri" data-act="yes">SÍ</button><button class="btn" data-act="no">NO</button></div>')}
const editing=()=>{const a=document.activeElement;return a&&$('#view').contains(a)&&/INPUT|SELECT/.test(a.tagName)&&a.type!=='checkbox'};
function schedule(){if(editing()){dirty=true;return}render()}

function perSup(){
  const per={};
  for(const l of Object.values(S.lista)){const p=per[l.superId]||(per[l.superId]={t:0,n:0,c:0});p.t+=lineTot(l);p.n++;if(l.check)p.c++}
  return Object.entries(per).sort((a,b)=>nSup(a[0]).localeCompare(nSup(b[0]),'es'));
}
function stats(){
  const el=$('#stats');
  if(view!=='lista'){el.innerHTML='';return}
  const L=Object.values(S.lista);let total=0,cart=0,nc=0;
  for(const l of L){const t=lineTot(l);total+=t;if(l.check){cart+=t;nc++}}
  el.innerHTML='<div class="tag"><div class="tg"><div class="l1"><small>Total</small><b>'+money(total)+'</b></div>'+
    '<div class="l2">En carrito '+nc+' de '+L.length+' · '+money(cart)+'</div></div>'+
    '<button class="mbtn" data-act="menu" aria-label="Opciones: filtrar, terminar o nueva compra"><i>☰</i>Opciones'+(fSup.size?'<em>'+fSup.size+'</em>':'')+'</button></div>';
}
let menuOpen=false;
function openMenu(){
  const ps=perSup(),L=Object.values(S.lista),tot=L.reduce((a,l)=>a+lineTot(l),0),nc=L.filter(l=>l.check).length;
  const sc=$('#modal ul')?.scrollTop||0;
  const row=(id,name,p,on)=>'<li><button class="mopt" data-fsup="'+esc(id)+'" aria-pressed="'+on+'"><span class="bx">'+(on?'✓':'')+'</span>'+
    '<span class="nm">'+esc(name)+'<small>Marcados '+p.c+' de '+p.n+' · '+(p.n-p.c?'Faltan '+(p.n-p.c):'Completo')+'</small></span><span class="am">'+money(p.t)+'</span></button></li>';
  modal('<h2>Opciones</h2><p class="mlab">Filtrar por supermercado</p>'+
    '<ul>'+row('','Todos',{t:tot,n:L.length,c:nc},!fSup.size)+ps.map(([id,p])=>row(id,nSup(id),p,fSup.has(id))).join('')+'</ul>'+
    '<p class="mlab">Compra</p><div class="yn mact"><button class="btn pri" data-act="finish">Terminar compra</button><button class="btn" data-act="reset">Nueva compra</button></div>'+
    '<button class="btn" data-act="no">Cerrar</button>');
  menuOpen=true;const u=$('#modal ul');if(u)u.scrollTop=sc;
}
const supOpts=(sel,first)=>(first?'<option value="">'+first+'</option>':'')+byName(S.sup,'nombre').map(([id,s])=>'<option value="'+id+'"'+(id===sel?' selected':'')+'>'+esc(s.nombre)+'</option>').join('');
const catOpts=(sel,first)=>(first?'<option value="">'+first+'</option>':'')+byName(S.cat,'nombre').map(([id,c])=>'<option value="'+id+'"'+(id===sel?' selected':'')+'>'+esc(c.nombre)+'</option>').join('');

function vLista(){
  if(!loaded.lista)return '<p class="empty">Cargando la lista compartida…</p>';
  const L=Object.entries(S.lista).sort((a,b)=>nSup(a[1].superId).localeCompare(nSup(b[1].superId),'es')||nProd(a[1].productoId).localeCompare(nProd(b[1].productoId),'es'));
  if(!L.length)return '<p class="empty">La lista está vacía.<br>Toque el botón + para agregar productos del catálogo.</p>';
  const sids=[...new Set(L.map(([,l])=>l.superId))];
  for(const x of [...fSup])if(!sids.includes(x))fSup.delete(x);
  let h='<div class="tools"><input type="search" id="q-lista" data-lq placeholder="Buscar producto en la lista" aria-label="Buscar producto en la lista" value="'+esc(lq)+'">'+
    (fSup.size?'<div class="fbar"><span>Filtro: '+esc([...fSup].map(nSup).join(', '))+'</span><button class="chip" data-fsup="">Quitar filtro</button></div>':'')+
    '<p id="lf-msg" hidden></p></div><ul>',g=null;
  for(const [id,l] of L){
    if(l.superId!==g){g=l.superId;h+='<li class="grp" data-g="'+esc(g)+'">'+esc(nSup(g))+'</li>'}
    const p=S.prod[l.productoId];
    h+='<li class="line'+(l.check?' on':'')+'" data-id="'+id+'" data-s="'+esc(l.superId)+'" data-t="'+esc(norm(nProd(l.productoId)))+'">'+
      '<input type="checkbox" id="chk-'+id+'" data-f="check" aria-label="En el carrito"'+(l.check?' checked':'')+'>'+
      '<div class="lb"><div class="lt"><label class="desc" for="chk-'+id+'">'+esc(nProd(l.productoId))+'<small>'+esc(nCat(p?.categoriaId))+'</small></label>'+
      '<span class="tot">'+money(lineTot(l))+'</span><button class="minus" data-act="del-line" aria-label="Excluir de la lista">−</button></div>'+
      '<div class="flds"><label>Supermercado<select id="sup-'+id+'" data-f="superId">'+(S.sup[l.superId]?'':'<option value="">—</option>')+supOpts(l.superId)+'</select></label>'+
      '<label>Cantidad<input type="text" inputmode="decimal" class="num" id="can-'+id+'" data-f="cantidad" value="'+numIn(l.cantidad)+'"></label>'+
      '<label>Costo unitario ₡<input type="text" inputmode="decimal" class="num" id="cos-'+id+'" data-f="costo" value="'+numIn(l.costo,1)+'"></label></div></div></li>';
  }
  return h+'</ul>';
}
function filtrarLista(){
  const q=norm(lq),lines=[...document.querySelectorAll('#view .line')];let vis=0;const gs=new Set();
  for(const li of lines){const ok=(!fSup.size||fSup.has(li.dataset.s))&&li.dataset.t.includes(q);li.hidden=!ok;if(ok){vis++;gs.add(li.dataset.s)}}
  document.querySelectorAll('#view .grp').forEach(g=>g.hidden=!gs.has(g.dataset.g));
  const m=$('#lf-msg');if(!m)return;
  m.hidden=vis===lines.length;
  m.textContent=vis?'Mostrando '+vis+' de '+lines.length+' productos.':'Ningún producto coincide con la búsqueda o el filtro.';
}
function vCatalogo(k){
  const c=K[k];
  if(!loaded[k])return '<p class="empty">Cargando…</p>';
  let h='<h2>'+c.titulo+'</h2><form class="form" data-form="'+k+'"><div class="row">'+
    '<input type="text" id="new-'+k+'" name="v" maxlength="80" required placeholder="'+(k==='prod'?'Descripción del producto':'Nombre de'+(k==='cat'?' la categoría':'l supermercado'))+'" aria-label="Nombre">'+
    (k==='prod'?'<select id="new-prod-cat" name="c" required aria-label="Categoría">'+catOpts('','Categoría…')+'</select>':'')+
    '</div>'+(k==='prod'?'<div class="row"><label>Supermercado<select id="new-prod-sup" name="s">'+supOpts('','Sin definir')+'</select></label><label>Costo unitario ₡<input type="text" inputmode="decimal" class="num" id="new-prod-cos" name="k" value="0,00"></label></div>':'')+'<button class="btn pri">Agregar '+c.uno+'</button></form>';
  if(k==='prod')h+='<div class="form"><div class="row"><input type="search" id="q-prod" data-filter placeholder="Buscar producto" aria-label="Buscar producto"><select id="qc-prod" data-filter aria-label="Filtrar por categoría">'+catOpts('','Todas las categorías')+'</select></div></div>';
  const rows=byName(S[k],c.f);
  if(!rows.length)return h+'<p class="empty">Todavía no hay '+c.titulo.toLowerCase()+'. Agregue '+(k==='cat'?'la primera':'el primero')+' arriba.</p>';
  h+='<ul id="items">';
  for(const [id,r] of rows)h+='<li class="item" data-id="'+id+'" data-t="'+esc(norm(r[c.f]))+'" data-c="'+esc(r.categoriaId||'')+'"><span class="desc">'+esc(r[c.f])+(k==='prod'?'<small>'+esc(nCat(r.categoriaId))+(S.sup[r.superId]?' · '+esc(nSup(r.superId)):'')+(+r.costo>0?' · '+money(r.costo):'')+'</small>':'')+'</span>'+
    '<button class="btn" data-act="edit" data-k="'+k+'">Editar</button><button class="btn warn" data-act="rm" data-k="'+k+'">Eliminar</button></li>';
  return h+'</ul>';
}
function vHist(){
  if(!loaded.hist)return '<p class="empty">Cargando…</p>';
  const C=Object.entries(S.hist).sort((a,b)=>b[0].localeCompare(a[0]));
  if(!C.length)return '<h2>Histórico de compras</h2><p class="empty">Aún no hay compras guardadas.<br>Al tocar Terminar compra, los productos marcados en verde se guardan aquí.</p>';
  let h='<h2>Histórico de compras</h2><ul>';
  for(const [id,c] of C){
    const ls=Array.isArray(c.lineas)?c.lineas:[];
    h+='<li><details><summary><span>'+esc(c.fecha)+' <small>'+esc(c.hora||'')+' · '+ls.length+(ls.length===1?' producto':' productos')+'</small></span><span>'+money(c.total)+'</span></summary>'+
      '<div class="tw"><table><thead><tr><th>Producto</th><th>Supermercado</th><th>Cant.</th><th>Costo unit.</th><th>Total</th></tr></thead><tbody>'+
      ls.map(l=>'<tr><td>'+esc(l.producto)+'</td><td>'+esc(l.supermercado)+'</td><td>'+numIn(l.cantidad)+'</td><td>'+money(l.costo)+'</td><td>'+money(l.total)+'</td></tr>').join('')+
      '</tbody></table></div></details></li>';
  }
  return h+'</ul>';
}
function render(){
  dirty=false;
  $('#nav').hidden=!authed||denied;
  if(aviso||!authed||denied){
    $('#stats').innerHTML='';$('#fab').hidden=true;
    $('#view').innerHTML=aviso?'<p class="empty">'+aviso+'</p>':denied?'<p class="empty">Su correo no está en la lista de correos autorizados.<br>Revise las reglas de seguridad (Parte 4 de la guía) y vuelva a entrar.</p>':
      '<h2>Ingresar</h2><form class="form" data-form="login"><label>Correo<input type="text" inputmode="email" autocomplete="username" id="lg-e" name="e" required></label><label>Contraseña<input type="password" autocomplete="current-password" id="lg-p" name="p" required style="width:100%;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:38px"></label><button class="btn pri">Entrar</button></form>';
    return;
  }
  stats();
  document.querySelectorAll('#nav button').forEach(b=>b.dataset.go===view?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
  $('#fab').hidden=view!=='lista';
  const open=[...document.querySelectorAll('#view details[open] summary')].map(s=>s.textContent);
  const m=$('#view'),top=m.scrollTop;
  m.innerHTML=view==='lista'?vLista():view==='hist'?vHist():vCatalogo(view);
  if(view==='lista')filtrarLista();
  if(menuOpen)openMenu();
  if(open.length)m.querySelectorAll('details').forEach(d=>{if(open.includes(d.querySelector('summary').textContent))d.open=true});
  m.scrollTop=top;
}
function filtrar(root,q,c){root.querySelectorAll('[data-t]').forEach(li=>{li.hidden=!(li.dataset.t.includes(norm(q))&&(!c||li.dataset.c===c))})}

/* ---------- acciones ---------- */
function lastCost(pid){
  for(const l of Object.values(S.lista))if(l.productoId===pid&&+l.costo>0)return +l.costo;
  for(const [,c] of Object.entries(S.hist).sort((a,b)=>b[0].localeCompare(a[0])))for(const l of (c.lineas||[]))if(l.productoId===pid&&+l.costo>0)return +l.costo;
  return 0;
}
function openAdd(){
  if(!Object.keys(S.prod).length)return toast('Primero registre productos en la pestaña Productos.');
  if(!Object.keys(S.sup).length)return toast('Primero registre un supermercado en la pestaña Súpers.');
  const firstSup=byName(S.sup,'nombre')[0][0];
  const rows=byName(S.prod,'descripcion').map(([id,p])=>{
    const sid=S.sup[p.superId]?p.superId:firstSup,cost=+p.costo>0?+p.costo:lastCost(id);
    const en=Object.values(S.lista).filter(l=>l.productoId===id).map(l=>nSup(l.superId));
    return '<li class="pk" data-t="'+esc(norm(p.descripcion))+'" data-c="'+esc(p.categoriaId||'')+'" data-pid="'+id+'">'+
      '<label class="ph"><input type="checkbox" class="m-chk" id="mk-'+id+'"><span class="desc">'+esc(p.descripcion)+'<small>'+esc(nCat(p.categoriaId))+(en.length?' · Ya en la lista: '+esc(en.join(', ')):'')+'</small></span><span class="tot" data-tot></span></label>'+
      '<div class="flds" hidden><label>Supermercado<select id="ms-'+id+'" data-m="s">'+supOpts(sid)+'</select></label>'+
      '<label>Cantidad<input type="text" inputmode="decimal" class="num" id="mq-'+id+'" data-m="q" value="1"></label>'+
      '<label>Costo unitario ₡<input type="text" inputmode="decimal" class="num" id="mc-'+id+'" data-m="c" value="'+numIn(cost,1)+'"></label></div></li>';
  }).join('');
  modal('<h2>Agregar a la lista</h2><div class="form" style="margin:0"><div class="row"><input type="search" id="m-q" placeholder="Buscar producto" aria-label="Buscar producto"><select id="m-c" aria-label="Filtrar por categoría">'+catOpts('','Todas las categorías')+'</select></div></div>'+
    '<form id="m-form" data-form="multi"><ul id="m-list">'+rows+'</ul><p id="m-sum"></p>'+
    '<div class="yn"><button class="btn pri" id="m-add">Agregar</button><button type="button" class="btn" data-act="no">Cancelar</button></div></form>');
  mSum();
}
function mRow(li){
  const on=li.querySelector('.m-chk').checked;
  li.classList.toggle('on',on);li.querySelector('.flds').hidden=!on;
  li.querySelector('[data-tot]').textContent=on?money(parseNum(li.querySelector('[data-m=q]').value)*parseNum(li.querySelector('[data-m=c]').value)):'';
}
function mSum(){
  const sel=[...document.querySelectorAll('#m-list .pk.on')];
  const t=sel.reduce((a,li)=>a+parseNum(li.querySelector('[data-m=q]').value)*parseNum(li.querySelector('[data-m=c]').value),0);
  $('#m-sum').textContent=sel.length?sel.length+(sel.length===1?' producto seleccionado':' productos seleccionados')+' · '+money(t):'Marque los productos que desea agregar.';
  const b=$('#m-add');b.disabled=!sel.length;b.textContent=sel.length?'Agregar ('+sel.length+')':'Agregar';
}
async function syncProd(pid,sid,cost){
  const p=S.prod[pid];if(!p)return;const d={};
  if(sid&&S.sup[sid]&&p.superId!==sid)d.superId=sid;
  if(+cost>0&&+p.costo!==+cost)d.costo=+cost;
  if(Object.keys(d).length){Object.assign(p,d);await save(db.doc(COLS.prod+'/'+pid).update(d))}
}
async function addSelected(){
  const items=[...document.querySelectorAll('#m-list .pk.on')].map(li=>({pid:li.dataset.pid,sid:li.querySelector('[data-m=s]').value,q:parseNum(li.querySelector('[data-m=q]').value),c:parseNum(li.querySelector('[data-m=c]').value)}));
  if(!items.length)return toast('Marque al menos un producto.');
  if(items.some(x=>!x.sid))return toast('Elija el supermercado de cada producto marcado.');
  const dup=items.filter(x=>dupLine(x.pid,x.sid));
  if(dup.length)return toast('Ya está en la lista con ese supermercado: '+dup.map(x=>nProd(x.pid)+' ('+nSup(x.sid)+')').join(', ')+'. Cambie el supermercado o desmárquelo.');
  closeModal();
  for(const x of items){
    if(!await save(db.collection(COLS.lista).add({productoId:x.pid,superId:x.sid,cantidad:x.q,costo:x.c,check:false})))return;
    await syncProd(x.pid,x.sid,x.c);
  }
  toast(items.length===1?'Producto agregado a la lista.':items.length+' productos agregados a la lista.');
}
const dupLine=(pid,sid,except)=>Object.entries(S.lista).some(([id,l])=>id!==except&&l.productoId===pid&&l.superId===sid);
const dupName=(k,v,except)=>Object.entries(S[k]).some(([id,r])=>id!==except&&norm(r[K[k].f])===norm(v));
function today(){const d=new Date(),p=n=>String(n).padStart(2,'0');return{fecha:d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()),hora:p(d.getHours())+':'+p(d.getMinutes()),id:d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())}}

function finish(){
  const L=Object.values(S.lista).filter(l=>l.check);
  if(!L.length)return toast('Marque al menos un producto para terminar la compra.');
  const t=today(),total=L.reduce((a,l)=>a+lineTot(l),0);
  confirmar('¿Guardar la compra del '+t.fecha+' con '+L.length+(L.length===1?' producto':' productos')+' por '+money(total)+'?',async()=>{
    const lineas=L.map(l=>({productoId:l.productoId,producto:nProd(l.productoId),supermercado:nSup(l.superId),cantidad:+l.cantidad||0,costo:+l.costo||0,total:Math.round(lineTot(l)*100)/100}));
    if(!await save(db.doc(COLS.hist+'/'+t.id).set({fecha:t.fecha,hora:t.hora,total:Math.round(total*100)/100,lineas})))return;
    for(const [id,l] of Object.entries(S.lista))if(l.check){l.check=false;if(!await save(db.doc(COLS.lista+'/'+id).update({check:false})))return}
    render();toast('Compra guardada en el histórico. Se desmarcaron todos los productos.');
  });
}
function reset(){
  confirmar('¿Iniciar una nueva compra? Se borran los checks y las cantidades. Se conserva el costo unitario.',async()=>{
    for(const [id,l] of Object.entries(S.lista))if(l.check||+l.cantidad)if(!await save(db.doc(COLS.lista+'/'+id).update({check:false,cantidad:0})))return;
    toast('Lista reiniciada.');
  });
}
function editItem(k,id){
  const r=S[k][id];if(!r)return;
  modal('<h2>Editar '+K[k].uno+'</h2><form class="form" data-form="edit" data-k="'+k+'" data-id="'+id+'" style="margin:0">'+
    '<input type="text" id="m-v" name="v" maxlength="80" required value="'+esc(r[K[k].f])+'" aria-label="Nombre">'+
    (k==='prod'?'<select id="m-pc" name="c" required aria-label="Categoría">'+catOpts(r.categoriaId,'Categoría…')+'</select>'+
      '<div class="row"><label>Supermercado<select id="m-ps" name="s">'+supOpts(S.sup[r.superId]?r.superId:'','Sin definir')+'</select></label><label>Costo unitario ₡<input type="text" inputmode="decimal" class="num" id="m-pk" name="k" value="'+numIn(r.costo,1)+'"></label></div>':'')+
    '<div class="yn"><button class="btn pri">Guardar</button><button type="button" class="btn" data-act="no">Cancelar</button></div></form>');
}
function rmItem(k,id){
  const r=S[k][id];if(!r)return;
  if(k==='cat'&&Object.values(S.prod).some(p=>p.categoriaId===id))return toast('No se puede eliminar: hay productos con esta categoría.');
  if(k==='sup'&&Object.values(S.lista).some(l=>l.superId===id))return toast('No se puede eliminar: está en uso en la lista actual.');
  if(k==='prod'&&Object.values(S.lista).some(l=>l.productoId===id))return toast('No se puede eliminar: el producto está en la lista actual.');
  confirmar('¿Está seguro de eliminar "'+r[K[k].f]+'" del catálogo?',()=>save(db.doc(COLS[k]+'/'+id).delete()));
}

document.addEventListener('click',e=>{
  const fs=e.target.closest('[data-fsup]');
  if(fs){const x=fs.dataset.fsup;if(!x)fSup.clear();else if(fSup.has(x))fSup.delete(x);else fSup.add(x);render();return}
  if(e.target.closest('[data-act="menu"]'))return openMenu();
  const go=e.target.closest('[data-go]');
  if(go){view=go.dataset.go;$('#view').scrollTop=0;render();return}
  if(e.target.id==='modal'){closeModal();return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.closest('[data-id]')?.dataset.id;
  if(a==='no')return closeModal();
  if(a==='yes'){const f=onYes;closeModal();if(f)f();return}
  if(!db)return toast('Sin conexión a los datos compartidos.');
  if(a==='add')openAdd();
  else if(a==='finish')finish();
  else if(a==='reset')reset();
  else if(a==='edit')editItem(b.dataset.k,id);
  else if(a==='rm')rmItem(b.dataset.k,id);
  else if(a==='del-line'){const l=S.lista[id];if(l)confirmar('¿Está seguro de excluir "'+nProd(l.productoId)+'" de la lista?',()=>save(db.doc(COLS.lista+'/'+id).delete()))}
});
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target,k=f.dataset.form;
  if(k==='login'){try{await firebase.auth().signInWithEmailAndPassword(f.elements.e.value.trim(),f.elements.p.value)}catch(err){toast('Correo o contraseña incorrectos.')}return}
  if(!db)return toast('Sin conexión a los datos compartidos.');
  if(k==='multi')return addSelected();
  const kk=k==='edit'?f.dataset.k:k,v=f.elements.v.value.trim(),id=k==='edit'?f.dataset.id:null;
  if(!v)return;
  if(dupName(kk,v,id))return toast('Ya existe un'+(kk==='cat'?'a ':' ')+K[kk].uno+' con ese nombre.');
  const data={[K[kk].f]:v};
  if(kk==='prod'){if(!f.elements.c.value)return toast('Elija una categoría.');data.categoriaId=f.elements.c.value;data.superId=f.elements.s.value||'';data.costo=parseNum(f.elements.k.value)}
  if(id){closeModal();await save(db.doc(COLS[kk]+'/'+id).update(data))}
  else{f.reset();document.activeElement?.blur();await save(db.collection(COLS[kk]).add(data))}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='m-q'||t.id==='m-c')return filtrar($('#m-list'),$('#m-q').value,$('#m-c').value);
  if(t.classList.contains('m-chk')||t.dataset.m){const li=t.closest('.pk');if(li){mRow(li);mSum()}return}
  if(t.dataset.lq!==undefined){lq=t.value;return filtrarLista()}
  if(t.dataset.filter!==undefined)return filtrar($('#items'),$('#q-prod').value,$('#qc-prod').value);
  const li=t.closest('.line'),f=t.dataset.f;
  if(li&&(f==='cantidad'||f==='costo')){const l=S.lista[li.dataset.id];if(!l)return;l[f]=parseNum(t.value);li.querySelector('.tot').textContent=money(lineTot(l));stats()}
});
document.addEventListener('change',async e=>{
  const t=e.target,li=t.closest('.line'),f=t.dataset.f;if(!li||!f||!db)return;
  const id=li.dataset.id,l=S.lista[id];if(!l)return;
  let v;
  if(f==='check'){v=t.checked;li.classList.toggle('on',v)}
  else if(f==='superId'){v=t.value;if(!v)return;if(dupLine(l.productoId,v,id)){toast('Ese producto ya está en la lista para ese supermercado.');t.blur();render();return}}
  else v=parseNum(t.value);
  l[f]=v;stats();
  if(await save(db.doc(COLS.lista+'/'+id).update({[f]:v}))&&(f==='superId'||f==='costo'))await syncProd(l.productoId,l.superId,l.costo);
});
document.addEventListener('focusin',e=>{if(e.target.classList?.contains('num'))e.target.select()});
document.addEventListener('focusout',()=>setTimeout(()=>{if(dirty&&!editing())render()},60));
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest?.('.line')&&e.target.type==='text')e.target.blur();if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});

const SEED={categorias:{'limpieza-hogar':'Limpieza Hogar','higiene-personal':'Higiene Personal',granos:'Granos',lacteos:'Lácteos',carnes:'Carnes',snacks:'Snacks'},supermercados:{pricesmart:'PriceSmart',walmart:'Walmart'}};
async function seed(){
  const r=db.doc('config/inicial'),s=await r.get();if(s.exists)return;
  for(const col in SEED)for(const id in SEED[col])await db.doc(col+'/'+id).set({nombre:SEED[col][id]});
  await r.set({creado:true});
}
function start(){
  if(!window.firebase){aviso='No se pudo cargar Firebase. Revise su conexión a internet y recargue la página.';$('#sync').textContent='Sin conexión';return render()}
  if(String(firebaseConfig.apiKey).includes('PEGUE')){aviso='Falta pegar la configuración de Firebase en el archivo index.html (Parte 5 de la guía).';$('#sync').textContent='Sin configurar';return render()}
  firebase.initializeApp(firebaseConfig);db=firebase.firestore();
  $('#out').addEventListener('click',()=>firebase.auth().signOut());
  firebase.auth().onAuthStateChanged(u=>{
    unsubs.forEach(f=>f());unsubs=[];authed=!!u;denied=false;$('#out').hidden=!u;
    for(const k in S){S[k]={};delete loaded[k]}
    $('#sync').textContent=u?'Lista compartida':'';
    render();if(!u)return;
    seed().catch(()=>{});
    for(const [k,col] of Object.entries(COLS))unsubs.push(db.collection(col).onSnapshot(snap=>{
      const o={};snap.docs.forEach(d=>{o[d.id]={...d.data()}});S[k]=o;loaded[k]=true;schedule();
    },e=>{if(e&&e.code==='permission-denied'){denied=true;render()}else $('#sync').textContent='Sin conexión'}));
  });
}
start();
</script>
